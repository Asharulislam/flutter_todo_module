plugins {
    id 'maven-publish'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.example.flutter_todo'
            artifactId = 'flutter_release'
            version = '1.1'
            artifact("build/host/outputs/repo/com/example/flutter_todo/flutter_release/1.0/flutter_release-1.0.aar")

            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                def deps = [
                    'flutter_embedding_release',
                    'armeabi_v7a_release',
                    'arm64_v8a_release',
                    'x86_64_release'
                ]
                deps.each { dep ->
                    def node = dependenciesNode.appendNode('dependency')
                    node.appendNode('groupId', 'io.flutter')
                    node.appendNode('artifactId', dep)
                    node.appendNode('version', '1.0.0-59aa584fdf100e6c78c785d8a5b565d1de4b48ab')
                    node.appendNode('scope', 'compile')
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Asharulislam/flutter_todo_module")
            credentials {
                username = project.findProperty("gpr.user")
                password = project.findProperty("gpr.key")
            }
        }
    }
}
